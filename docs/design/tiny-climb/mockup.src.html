<meta charset="utf-8">
<title>Mountaineer Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  @font-face { font-family: PlexReg; src: url(__PLEX_REGULAR__); }
  @font-face { font-family: PlexMed; src: url(__PLEX_MEDIUM__); }
  @font-face { font-family: PlexSemi; src: url(__PLEX_SEMIBOLD__); }
  @font-face { font-family: PlexCond; src: url(__PLEX_COND__); }
  /*__RELATIVE_FACE__*/
  :root { --bg: #2A2A2A; --ink: #EDEDED; --muted: #9A9A9A; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 PlexMed, system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h2 { font: 20px PlexSemi, sans-serif; margin: 40px 0 4px; }
  h2:first-child { margin-top: 0; }
  p.note { color: var(--muted); margin: 0 0 14px; max-width: 640px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .row canvas { max-width: 100%; height: auto !important; }
</style>
<main id="out"></main>
<script>
/*__KAROO_DEVICE_JS__*/
</script>
<script>
const ICONS = "__ICONS__";
let HAS_RELATIVE = false;   // set when the preview build carries the Karoo's Relative font
const img = s => new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.src = s; });

// Showcase numbers (design-assets/tools/field-gallery/showcase.json) for the other fields
const F = {
  power: { label: '3S POWER', value: '280', icon: 'bolt' },
  hr:    { label: 'HR', value: '132', icon: 'heart' },
  speed: { label: 'SPEED', value: '28.4', icon: 'speed' },
  lap:   { label: 'LAP TIME', value: '4:21', icon: 'lap-timer' },
  lapspd:{ label: 'LAP AVG SPEED', value: '29.1', icon: 'lap-speed' },
};

// Demo climb: 6.4 km, 16 pieces of 400 m, grade per piece (%). Rider at 3.8 km.
const CLIMB = {
  name: 'Col du Lac', lengthKm: 6.4, avg: 7.5, gainM: 482,
  grades: [4, 6, 7, 8, 9, 7, 6, 10, 12, 9, 8, 7, 11, 8, 6, 5],
  at: 3.8 / 6.4,
  toTop: '9:42', leftKm: '2.6', leftM: 196,
  pr: '24:12', behind: '+0:18', ahead: '−0:24', grade: 9,
  nextIn: '3.2',
};
// Grade colours: the Karoo's own climb table (ride app climb1..7, same in light and dark).
const CLIMB_COL = ['#60EEB2', '#00B988', '#FFF500', '#FB8C65', '#FE581F', '#D60404', '#B700A2'];
const gradeCol = g => CLIMB_COL[g < 3 ? 0 : g < 5 ? 1 : g < 7 ? 2 : g < 9 ? 3 : g < 11 ? 4 : g < 13 ? 5 : 6];
const gapCol = (dark, behind) => behind ? (dark ? '#FF5A4E' : '#C40404') : (dark ? '#60EEB2' : '#007A5A');

// Round 25: the Karoo's own names (Strava Live Segments: "PR", "Time to PR"; navigation's
// "Time to Destination" → TIME TO TOP). Applied to the labels when NAMES is 'karoo'.
let NAMES = 'karoo';   // round 25: we picked the Karoo's names
const KAROO_NAMES = { 'STRAVA PR': 'PR', 'VS PR': 'TIME TO PR', 'ETA TO TOP': 'TIME TO TOP', 'PR': 'PR' };
function text(ctx, s, font, size, color, x, baseline, maxW = 1e9, scaleX = 1, align = 'right') {
  if (NAMES === 'karoo' && KAROO_NAMES[s]) s = KAROO_NAMES[s];
  // Round 13: numbers like the Karoo's own fields (and BetterIntervals, matched on the device):
  // Plex Regular at 90 % width, letters 0.05 em tighter. 82 % thinned the strokes.
  const karooNum = scaleX === 0.82;
  if (karooNum && HAS_RELATIVE) { font = 'Relative'; scaleX = 1; }   // round 20: the Karoo's value font (preview only)
  else if (karooNum) scaleX = 0.9;
  ctx.letterSpacing = karooNum ? `${(HAS_RELATIVE ? -0.04 : -0.05) * size}px` : '0px';
  ctx.font = `${size}px ${font}`;
  let w = ctx.measureText(s).width * scaleX;
  if (w > maxW) { size *= maxW / w; ctx.font = `${size}px ${font}`; w = maxW; }
  ctx.save(); ctx.translate(x, baseline); ctx.scale(scaleX, 1);
  ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(s, 0, 0); ctx.restore();
  ctx.letterSpacing = '0px';
  return w;
}
function iconAt(ctx, name, dark, x, y, k = 1) {
  const i = ICONS_IMG[`${name}-${dark ? 'dark' : 'light'}`];
  if (i) ctx.drawImage(i, x, y, i.width * k, i.height * k);
}
// Small mountain icon (our own, Karoo icon size: 25 px box, ends on the label baseline)
function mountain(ctx, x, baseline, color, s = 25) {
  const k = s / 25, y = baseline - 20 * k;
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(9, 3); ctx.lineTo(13.5, 11); ctx.lineTo(17, 6); ctx.lineTo(25, 20); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// Strava symbol next to the mountain wherever a PR is shown. Three candidates:
//   chevron: Strava's double chevron in Strava orange (their mark: check brand rules before release)
//   medal:   a PR medal, like the one Strava gives for a personal record
//   badge:   an orange "PR" pill
// Draws in a 22 px box ending on [baseline]; returns its width.
const STRAVA = '#FC4C02';
let PR_ICON = 'karoo';   // round 25: the Karoo's PR rosette (was medal / badge)   // Settings › PR symbol: PR medal (default) / PR badge
function stravaIcon(ctx, x, baseline, dark, kind = PR_ICON, s = 22) {
  if (kind === 'karoo') {   // round 25: the Karoo's own PR rosette (ink 13..34 × 8..39 in its 41 viewport, after translate -3)
    const k = s / 31; ctx.save(); ctx.translate(x - 10 * k, baseline - 36 * k); ctx.scale(k, k);
    ctx.fillStyle = typeof dark === 'string' ? dark : (dark ? '#FFF' : '#000'); ctx.fill(P_PR); ctx.restore(); return 21 * k;
  }
  const k = s / 22, y = baseline - 21 * k;
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  if (kind === 'chevron') {
    ctx.translate(0, -3); ctx.scale(1.15, 1.15);
    ctx.fillStyle = STRAVA;
    ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(7, 0); ctx.lineTo(14, 14); ctx.lineTo(9.6, 14); ctx.lineTo(7, 9); ctx.lineTo(4.4, 14); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.65;
    ctx.beginPath(); ctx.moveTo(10.5, 14); ctx.lineTo(13.5, 14); ctx.lineTo(15.5, 18); ctx.lineTo(17.5, 14); ctx.lineTo(20.5, 14); ctx.lineTo(15.5, 22); ctx.closePath(); ctx.fill();
    ctx.restore(); return 24 * k;
  }
  if (kind === 'medal') {
    ctx.fillStyle = STRAVA;
    ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(8, 0); ctx.lineTo(11, 7); ctx.lineTo(8, 10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(19, 0); ctx.lineTo(14, 0); ctx.lineTo(11, 7); ctx.lineTo(14, 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#F2B01E'; ctx.beginPath(); ctx.arc(11, 15, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#B07A00'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(11, 15, 4.5, 0, Math.PI * 2); ctx.stroke();
    ctx.restore(); return 22 * k;
  }
  // badge
  ctx.fillStyle = STRAVA; ctx.beginPath(); ctx.roundRect(0, 3, 30, 19, 5); ctx.fill();
  ctx.font = '15px PlexSemi'; ctx.fillStyle = '#FFF'; ctx.textAlign = 'center'; ctx.fillText('PR', 15, 18);
  ctx.restore(); return 30 * k;
}

// A Karoo stock field (same metrics as compose.swift)
function stock(ctx, r, f, dark) {
  const ink = dark ? '#FFF' : '#000';
  const ls = r.h < 150 ? 28 : 31.875;
  text(ctx, f.label, 'PlexCond', ls, ink, r.x + r.w - 8, r.y + 8 + ls * 0.82, r.w - 90);
  iconAt(ctx, f.icon, dark, r.x + 6, r.y + 6 + ls * 0.82 - 40 * 0.62);
  text(ctx, f.value, 'PlexReg', Math.min(r.h * 0.58, 116), ink, r.x + r.w - 8, r.y + r.h - r.h * 0.08, r.w - 16, 0.82);
}
// Header like the Karoo's own: mountain left, capitals right
function header(ctx, r, label, dark, ink, strava = false) {
  const ls = 31.875, base = r.y + 8 + ls * 0.82;
  mountain(ctx, r.x + 12, base, ink);
  const left = strava ? 44 + stravaIcon(ctx, r.x + 44, base, dark) + 8 : 46;
  text(ctx, label, 'PlexCond', ls, ink, r.x + r.w - 8, base, r.w - left - 8);
  return base;
}
const LABEL = { top: 'ETA TO TOP', dist: 'DIST TO TOP', pr: 'VS PR' };

// The climb profile: one filled piece per 400 m in its grade colour, ridden part grey,
// the rider as a ▼ + line like BetterIntervals' "now" marker.
function profile(ctx, b, dark, o = {}) {
  const ink = dark ? '#FFF' : '#000';
  const g = CLIMB.grades, n = g.length;
  const e = [0]; g.forEach((v, i) => e.push(e[i] + v));
  const eMax = e[n];
  const X = i => b.x + (i / n) * b.w, Y = i => b.y + b.h - (0.14 + 0.86 * e[i] / eMax) * b.h;
  const bottom = b.y + b.h;
  const piece = (i, fill) => {
    ctx.beginPath(); ctx.moveTo(X(i), bottom); ctx.lineTo(X(i), Y(i)); ctx.lineTo(X(i + 1), Y(i + 1)); ctx.lineTo(X(i + 1), bottom); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
  };
  const ridden = dark ? '#4A4A4A' : '#CFCFCF';
  for (let i = 0; i < n; i++) piece(i, o.idle ? ridden : gradeCol(g[i]));
  const px = b.x + CLIMB.at * b.w;
  if (!o.idle && o.ridden !== 'colour') {           // ridden part grey
    ctx.save(); ctx.beginPath(); ctx.rect(b.x, b.y - 4, px - b.x, b.h + 8); ctx.clip();
    for (let i = 0; i < n; i++) piece(i, ridden);
    ctx.restore();
  }
  // thin top edge so yellow reads on white
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); for (let i = 1; i <= n; i++) ctx.lineTo(X(i), Y(i));
  ctx.strokeStyle = ink; ctx.lineWidth = o.big ? 2 : 1.5; ctx.lineJoin = 'round'; ctx.stroke();
  if (o.idle) return;
  // marker
  const t = o.big ? 7 : 5.5, top = o.markerTop ?? b.y;
  ctx.strokeStyle = ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px, top + 2); ctx.lineTo(px, bottom); ctx.stroke();
  ctx.fillStyle = ink; ctx.beginPath(); ctx.moveTo(px - t, top - t * 1.2); ctx.lineTo(px + t, top - t * 1.2); ctx.lineTo(px, top + 2); ctx.closePath(); ctx.fill();
}

// ---- The field at its three sizes -------------------------------------------------

// Small (one tile, 238×168): mountain + label, the number, the tiny profile under it.
function small(ctx, r, dark, o = {}) {
  const ink = dark ? '#FFF' : '#000';
  const show = o.show || 'top';
  if (o.idle) {
    header(ctx, r, 'NEXT CLIMB', dark, ink);
    text(ctx, CLIMB.nextIn, 'PlexReg', 58, ink, r.x + r.w - 8 - 30, r.y + 94, r.w, 0.82);
    text(ctx, 'km', 'PlexCond', 24, ink, r.x + r.w - 8, r.y + 94);
    profile(ctx, { x: r.x + 12, y: r.y + 108, w: r.w - 24, h: 52 }, dark, { idle: true });
    return;
  }
  header(ctx, r, LABEL[show], dark, ink, show === 'pr');
  if (show === 'dist') {
    text(ctx, CLIMB.leftKm, 'PlexReg', 58, ink, r.x + r.w - 8 - 30, r.y + 94, r.w, 0.82);
    text(ctx, 'km', 'PlexCond', 24, ink, r.x + r.w - 8, r.y + 94);
  } else {
    const val = show === 'top' ? CLIMB.toTop : (o.ahead ? CLIMB.ahead : CLIMB.behind);
    const col = show === 'top' ? ink : gapCol(dark, !o.ahead);
    text(ctx, val, 'PlexReg', 58, col, r.x + r.w - 8, r.y + 94, r.w - 16, 0.82);
  }
  profile(ctx, { x: r.x + 12, y: r.y + 108, w: r.w - 24, h: 52 }, dark, o);
}

// Wide (two tiles, 478×168): climb name in the header, profile left, number right.
function wide(ctx, r, dark, o = {}) {
  const ink = dark ? '#FFF' : '#000', muted = dark ? '#A8A8A8' : '#5E5E5E';
  const show = o.show || 'top';
  const ls = 31.875, base = r.y + 8 + ls * 0.82;
  mountain(ctx, r.x + 12, base, ink);
  if (o.idle) {
    text(ctx, 'NEXT CLIMB', 'PlexCond', ls, ink, r.x + r.w - 8, base);
    text(ctx, CLIMB.name, 'PlexMed', 26, ink, r.x + 46, base, 200, 1, 'left');
    profile(ctx, { x: r.x + 12, y: r.y + 66, w: 250, h: 90 }, dark, { idle: true });
    text(ctx, CLIMB.nextIn, 'PlexReg', 72, ink, r.x + r.w - 8 - 34, r.y + 128, 160, 0.82);
    text(ctx, 'km', 'PlexCond', 26, ink, r.x + r.w - 8, r.y + 128);
    text(ctx, `${CLIMB.lengthKm} km · ${CLIMB.avg}%`, 'PlexMed', 21, muted, r.x + r.w - 8, r.y + 156);
    return;
  }
  const pr = show === 'pr' || show === 'both';
  text(ctx, LABEL[show === 'both' ? 'top' : show], 'PlexCond', ls, ink, r.x + r.w - 8, base);
  const nameX = pr ? 44 + stravaIcon(ctx, r.x + 44, base, dark) + 8 : 46;
  text(ctx, CLIMB.name, 'PlexMed', 26, ink, r.x + nameX, base, 200, 1, 'left');
  profile(ctx, { x: r.x + 12, y: r.y + 70, w: 262, h: 88 }, dark, o);
  if (show === 'dist') {
    text(ctx, CLIMB.leftKm, 'PlexReg', 76, ink, r.x + r.w - 8 - 36, r.y + 124, 150, 0.82);
    text(ctx, 'km', 'PlexCond', 28, ink, r.x + r.w - 8, r.y + 124);
    text(ctx, `${CLIMB.leftM} m to climb`, 'PlexMed', 21, muted, r.x + r.w - 8, r.y + 157);
    return;
  }
  const big = show === 'pr' ? (o.ahead ? CLIMB.ahead : CLIMB.behind) : CLIMB.toTop;
  const bigCol = show === 'pr' ? gapCol(dark, !o.ahead) : ink;
  text(ctx, big, 'PlexReg', 76, bigCol, r.x + r.w - 8, r.y + 124, 180, 0.82);
  if (show === 'both') {
    const w = text(ctx, 'VS PR', 'PlexCond', 24, muted, r.x + r.w - 8, r.y + 157);
    text(ctx, o.ahead ? CLIMB.ahead : CLIMB.behind, 'PlexMed', 26, gapCol(dark, !o.ahead), r.x + r.w - 8 - w - 8, r.y + 157);
  } else {
    text(ctx, `${CLIMB.leftKm} km · ${CLIMB.leftM} m`, 'PlexMed', 21, muted, r.x + r.w - 8, r.y + 157);
  }
}

// Half screen (478×348): name, then Strava PR | vs PR | To top, then a big profile.
function halfScreen(ctx, r, dark, o = {}) {
  const ink = dark ? '#FFF' : '#000', muted = dark ? '#A8A8A8' : '#5E5E5E';
  const sh = Object.assign({ name: true, pr: true, gap: true, top: true }, o.items || {});
  let y = r.y;
  if (sh.name) {
    mountain(ctx, r.x + 12, r.y + 40, ink, 28);
    const nameX = (sh.pr || sh.gap) ? 48 + stravaIcon(ctx, r.x + 48, r.y + 40, dark, PR_ICON, 25) + 9 : 50;
    text(ctx, o.idle ? `Next: ${CLIMB.name}` : CLIMB.name, 'PlexSemi', 30, ink, r.x + nameX, r.y + 40, 250, 1, 'left');
    text(ctx, `${CLIMB.lengthKm} km · ${CLIMB.avg}%`, 'PlexMed', 21, muted, r.x + r.w - 10, r.y + 38);
    y += 52;
  }
  const cols = [];
  if (o.idle) cols.push({ l: 'IN', v: CLIMB.nextIn + ' km', c: ink }, { l: 'STRAVA PR', v: CLIMB.pr, c: ink }, { l: 'CLIMB', v: CLIMB.gainM + ' m', c: ink });
  else {
    if (sh.pr) cols.push({ l: 'STRAVA PR', v: CLIMB.pr, c: ink });
    if (sh.gap) cols.push({ l: 'VS PR', v: o.ahead ? CLIMB.ahead : CLIMB.behind, c: gapCol(dark, !o.ahead) });
    if (sh.top) cols.push({ l: 'ETA TO TOP', v: CLIMB.toTop, c: ink });
  }
  if (cols.length) {
    const cw = (r.w - 8) / cols.length;
    cols.forEach((c, i) => {
      const right = r.x + 4 + cw * (i + 1) - 10;
      text(ctx, c.l, 'PlexCond', 24, ink, right, y + 26);
      text(ctx, c.v, 'PlexReg', cols.length === 3 ? 54 : 64, c.c, right, y + 82, cw - 16, 0.82);
      if (i) { ctx.fillStyle = dark ? '#3A3A3A' : '#E2E2E2'; ctx.fillRect(r.x + 4 + cw * i, y + 8, 1, 76); }
    });
    y += 96;
  }
  const b = { x: r.x + 14, y: y + 30, w: r.w - 28, h: r.y + r.h - 34 - (y + 30) };
  profile(ctx, b, dark, { ...o, big: true, markerTop: y + 26 });
  // under the profile: km ridden at the marker, km left at the end
  if (!o.idle) {
    const px = b.x + CLIMB.at * b.w;
    text(ctx, `${CLIMB.grade}%`, 'PlexSemi', 22, ink, px + 12, y + 22, 1e9, 1, 'left');
    text(ctx, `${CLIMB.leftKm} km to top`, 'PlexMed', 20, muted, r.x + r.w - 14, r.y + r.h - 9);
    text(ctx, `3.8 of ${CLIMB.lengthKm} km`, 'PlexMed', 20, muted, r.x + 14, r.y + r.h - 9, 1e9, 1, 'left');
  }
}

// ---- Half screen, round 4 options ---------------------------------------------------
// One type scale for all three: labels PlexCond (the Karoo's field label font), numbers PlexReg
// at 0.82 width (the Karoo's field numbers), the name PlexMed. Native ClimbER (ride app, read
// 2026-11-08): header = climb number pill + three 30sp numbers centred with 1dp dividers;
// a 30dp detail bar "To Top" + distance + height in 26sp white; climb blue
// #005297 (600) / #00294B (700) / #2386D9 (500) / #A3D5FF (400). 1 dp = 1.875 px on a Karoo 3.
const CB = { b400: '#A3D5FF', b500: '#2386D9', b600: '#005297', b700: '#00294B' };
const gapNow = o => o.ahead ? CLIMB.ahead : CLIMB.behind;
const nowGradeCol = () => gradeCol(CLIMB.grade);
function divider(ctx, x, y1, y2, dark) { ctx.fillStyle = dark ? '#3A3A3A' : '#DDDDDD'; ctx.fillRect(Math.round(x), y1, 1, y2 - y1); }

// A · Karoo field grid: every part sits like a Karoo field (header row, right-aligned label over
// right-aligned number, 9 px right margin), one label size, one number size.
function halfA(ctx, r, dark, o = {}) {
  const ink = dark ? '#FFF' : '#000', muted = dark ? '#A8A8A8' : '#5E5E5E';
  const base = r.y + 34;
  mountain(ctx, r.x + 12, base, ink);
  const nx = 44 + stravaIcon(ctx, r.x + 44, base, dark) + 8;
  text(ctx, CLIMB.name.toUpperCase(), 'PlexCond', 31.875, ink, r.x + nx, base, 250, 1, 'left');
  text(ctx, `${CLIMB.lengthKm} KM · ${CLIMB.avg}%`, 'PlexCond', 26, muted, r.x + r.w - 9, base);
  const cols = [['STRAVA PR', CLIMB.pr, ink], ['VS PR', gapNow(o), gapCol(dark, !o.ahead)], ['ETA TO TOP', CLIMB.toTop, ink]];
  const cw = r.w / 3, top = r.y + 50;
  cols.forEach(([l, v, c], i) => {
    const right = r.x + cw * (i + 1) - 9;
    text(ctx, l, 'PlexCond', 26, ink, right, top + 24);
    text(ctx, v, 'PlexReg', 64, c, right, top + 92, cw - 18, 0.82);
    if (i) divider(ctx, r.x + cw * i, top + 4, top + 96, dark);
  });
  const b = { x: r.x + 12, y: r.y + 182, w: r.w - 24, h: 130 };
  profile(ctx, b, dark, { ...o, big: true, markerTop: r.y + 176 });
  text(ctx, `3.8 / ${CLIMB.lengthKm} KM`, 'PlexCond', 24, muted, r.x + 12, r.y + r.h - 9, 1e9, 1, 'left');
  text(ctx, `${CLIMB.leftKm} KM · ${CLIMB.leftM} M TO TOP`, 'PlexCond', 24, muted, r.x + r.w - 9, r.y + r.h - 9);
}

// B · Native ClimbER: climb-blue header with the numbered pill and name, three centred numbers
// with dividers, the profile, the blue "TO TOP" detail bar at the bottom. Blue in light and dark.
function halfB(ctx, r, dark, o = {}) {
  const ink = dark ? '#FFF' : '#000';
  const bandH = 60;
  ctx.fillStyle = CB.b600; ctx.fillRect(r.x, r.y, r.w, bandH);
  // pill with the climb number
  ctx.fillStyle = CB.b700; ctx.beginPath(); ctx.roundRect(r.x + 10, r.y + 10, 44, 40, 15); ctx.fill();
  ctx.strokeStyle = CB.b500; ctx.lineWidth = 2; ctx.stroke();
  text(ctx, '1', 'PlexMed', 30, CB.b400, r.x + 32, r.y + 41, 1e9, 1, 'center');
  const nx = 64 + stravaIcon(ctx, r.x + 64, r.y + 40, dark) + 8;
  text(ctx, CLIMB.name, 'PlexMed', 30, '#FFF', r.x + nx, r.y + 41, 230, 1, 'left');
  text(ctx, `${CLIMB.lengthKm} km · ${CLIMB.avg}%`, 'PlexMed', 22, CB.b400, r.x + r.w - 12, r.y + 39);
  // three numbers, centred, label under (native: 30sp numbers, 1dp dividers)
  const cols = [['STRAVA PR', CLIMB.pr, ink], ['VS PR', gapNow(o), gapCol(dark, !o.ahead)], ['ETA TO TOP', CLIMB.toTop, ink]];
  const cw = r.w / 3, top = r.y + bandH;
  cols.forEach(([l, v, c], i) => {
    const cx = r.x + cw * i + cw / 2;
    text(ctx, v, 'PlexReg', 60, c, cx, top + 60, cw - 16, 0.82, 'center');
    text(ctx, l, 'PlexCond', 22, dark ? '#BDBDBD' : '#4A4A4A', cx, top + 88, 1e9, 1, 'center');
    if (i) { ctx.fillStyle = CB.b500; ctx.fillRect(Math.round(r.x + cw * i), top + 14, 1.875, 78); }
  });
  const barH = 56;
  const b = { x: r.x + 4, y: top + 120, w: r.w - 8, h: r.y + r.h - barH - (top + 120) };
  profile(ctx, b, dark, { ...o, big: true, markerTop: top + 114 });

  ctx.fillStyle = CB.b600; ctx.fillRect(r.x, r.y + r.h - barH, r.w, barH);

  text(ctx, `${CLIMB.leftKm} km`, 'PlexReg', 36, '#FFF', r.x + r.w - 120, by, 1e9, 0.82);
}

// C · Profile first: name and the grade you're on over the profile, the profile big, a row of

function halfC(ctx, r, dark, o = {}) {

  text(ctx, `${CLIMB.grade}%`, 'PlexSemi', 28, '#000', r.x + r.w - 52, r.y + 42, 1e9, 1, 'center');

// ---- Round 5: the Karoo's own climb graph --------------------------------------------
// From ClimbER photos + the ride app's code (2026-11-08):
// navy graph (#00294B) in light and dark; 100 m bars in grade colours; climbed part hatched;
// a white ring where you are with a white line down; the next 500 m lit in climb blue 600
// above the profile; a strip of 100 m grades (one decimal) in their colours, white lines between;
// "TO TOP" bar in climb blue with distance + height left.
// Grade colours (ride app, grade rounded to 0.1): <2 c1, <5 c2, <8 c3, <11 c4, <14 c5, <20 c6,
// else c7; text black on c1..c4, white on c5..c7.
const nGradeIdx = g => g < 2 ? 0 : g < 5 ? 1 : g < 8 ? 2 : g < 11 ? 3 : g < 14 ? 4 : g < 20 ? 5 : 6;
const nGradeCol = g => CLIMB_COL[nGradeIdx(g)];
const nGradeInk = g => nGradeIdx(g) >= 4 ? '#FFF' : '#000';
// The demo climb at 100 m: the 400 m pieces with some wobble, one decimal.
const G100 = Array.from({ length: 64 }, (_, i) => {
  const base = CLIMB.grades[Math.floor(i / 4)];
  return Math.max(0.5, Math.round((base + 1.4 * Math.sin(i * 1.3) + 0.7 * Math.sin(i * 2.7)) * 10) / 10);
});
let NOW_KM = 3.8;   // let: round 13 moves it to show the strip sliding
let BAND = {};
let WHOLE = true;
let MARK_PX = 28;   // round 18: 28 px
let MARK = 'edgeBracket';   // round 15: D without dimming (white edge + bracket); null: round 13's band
//   // round 14: 'bracket' | 'spot' | 'end' | 'spotBracket' (null: round 13's band)   // round 13: half screens always show the whole climb   // round 9: the 500 m band's look, set per picture
const E100 = [0]; G100.forEach((g, i) => E100.push(E100[i] + g));   // metres per 100 m = grade
const elevAt = km => { const i = Math.min(63, Math.floor(km * 10)), f = km * 10 - i; return E100[i] + f * G100[i]; };

// Round 33: before the climb, the road up to it from the route's elevation, in the first fifth
// of the graph so the climb keeps the rest. APPROACH: 'fill' (a muted blue silhouette) or 'line'
// (just the road as a light line, no fill); null: off. A dashed white line where the climb starts.
let APPROACH = null;
const APPROACH_SPLIT = 0.2, APPROACH_MUTED = '#3D6A93';
const aElev = k => 14 * Math.sin(k * 1.9) + 9 * Math.sin(k * 4.3) - 6 * k;   // k ≤ 0: km before the start (0 m there)
function approachGraph(ctx, b, o) {
  const A = parseFloat(CLIMB.nextIn), L = CLIMB.lengthKm, mode = APPROACH, seg = o.seg ?? 0.1, gh = b.h;
  ctx.save(); ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
  ctx.fillStyle = CB.b700; ctx.fillRect(b.x, b.y, b.w, gh);
  const sx = b.x + APPROACH_SPLIT * b.w;
  const X = k => k < 0 ? b.x + (k + A) / A * (sx - b.x) : sx + k / L * (b.x + b.w - sx);
  const E = k => k < 0 ? aElev(k) : elevAt(Math.min(k, 6.4));
  let lo = 1e9, hi = -1e9; for (let k = -A; k <= L + 1e-9; k += 0.05) { const e = E(k); lo = Math.min(lo, e); hi = Math.max(hi, e); }
  const head = o.head ?? 0.38;
  const Y = e => b.y + gh - (0.1 + (1 - head - 0.1) * (e - lo) / Math.max(1, hi - lo)) * gh;
  const grade = (k0, k1) => (E(k1) - E(k0)) / ((k1 - k0) * 10);
  const rr = o.ring ?? 10, small = b.h < 150;
  // the climb, as always
  ctx.save(); ctx.beginPath(); ctx.moveTo(X(0), b.y + gh);
  for (let k = 0; k <= L + 1e-9; k += 0.025) ctx.lineTo(X(k), Y(E(k)));
  ctx.lineTo(X(L), b.y + gh); ctx.closePath(); ctx.clip();
  for (let k = 0; k < L - 1e-9; k += seg) { ctx.fillStyle = nGradeCol(grade(k, Math.min(L, k + seg))); ctx.fillRect(X(k), b.y, X(Math.min(L, k + seg)) - X(k) + 0.6, gh); }
  ctx.restore();
  // the road up to it
  ctx.beginPath(); ctx.moveTo(X(-A), Y(E(-A)));
  for (let k = -A; k <= 1e-9; k += 0.025) ctx.lineTo(X(k), Y(E(Math.min(0, k))));
  if (mode === 'fill') { ctx.lineTo(X(0), b.y + gh); ctx.lineTo(X(-A), b.y + gh); ctx.closePath(); ctx.fillStyle = APPROACH_MUTED; ctx.fill(); }
  else { ctx.strokeStyle = CB.b400; ctx.lineWidth = small ? 2 : 3; ctx.lineJoin = 'round'; ctx.stroke(); }
  // where the climb starts: a dashed white line, START over it on the bigger sizes
  const top = Math.max(b.y + (small ? 4 : 30), Y(E(0)) - (small ? 24 : 70));
  ctx.strokeStyle = '#FFF'; ctx.lineWidth = small ? 1.5 : 2; ctx.setLineDash(small ? [3, 3] : [5, 4]);
  ctx.beginPath(); ctx.moveTo(X(0), top); ctx.lineTo(X(0), b.y + gh); ctx.stroke(); ctx.setLineDash([]);
  if (!small) text(ctx, 'START', 'PlexCond', 20, '#FFF', X(0) + 6, top + 14, 1e9, 1, 'left');
  // you: at the left, where the road starts
  const px = b.x + rr + 3, py = Y(E(-A + (px - b.x) / (sx - b.x) * A));
  ctx.fillStyle = '#FFF'; ctx.fillRect(px - rr * 0.22, py, rr * 0.44, b.y + gh - py);
  ctx.beginPath(); ctx.arc(px, py, rr, 0, Math.PI * 2); ctx.fillStyle = '#FFF'; ctx.fill();
  ctx.beginPath(); ctx.arc(px, py, rr * 0.5, 0, Math.PI * 2); ctx.fillStyle = CB.b700; ctx.fill();
  if (o.label) o.label(ctx, b, X, Y);
  ctx.restore();
}
// The native graph in box b. o.from / o.to: km window (default whole climb); o.seg: km per bar
// (0.1 native; 0.4 for tiny tiles); o.strip: height of the grade strip under it (0 = none);
// o.ring: ring radius.
function nGraph(ctx, b, o = {}) {
  if (o.noYou && APPROACH) return approachGraph(ctx, b, o);   // round 33
  const from = o.from ?? 0, to = o.to ?? CLIMB.lengthKm, seg = o.seg ?? 0.1;
  const stripH = o.strip || 0, gh = b.h - stripH, NOW = o.noYou ? -1 : NOW_KM;
  ctx.save(); ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
  ctx.fillStyle = CB.b700; ctx.fillRect(b.x, b.y, b.w, gh);
  const X = km => b.x + (km - from) / (to - from) * b.w;
  let lo = 1e9, hi = -1e9; for (let k = from; k <= to + 1e-9; k += 0.05) { const e = elevAt(Math.min(k, 6.4)); lo = Math.min(lo, e); hi = Math.max(hi, e); }
  const head = o.head ?? 0.38;                         // headroom above the profile (native: lots)
  const Y = e => b.y + gh - (0.1 + (1 - head - 0.1) * (e - lo) / Math.max(1, hi - lo)) * gh;
  const grade = (k0, k1) => (elevAt(Math.min(k1, 6.4)) - elevAt(k0)) / ((Math.min(k1, 6.4) - k0) * 10);
  // next 500 m lit above the profile (native: a rect behind the profile), named when it fits.
  // BAND (round 9 options): tone 'blue' (climb blue 600) or 'tonal' (a dark step up from the
  // navy); reach 'full' (to the top) or 'short' (stops a little above the road in it).
  if (!o.noYou && !o.noBand && !MARK) {   // one tile and two tiles: no band (round 10)
    const band = Object.assign({ tone: 'blue', reach: 'short' }, BAND, o.band || {});   // round 10: C
    const bx = X(NOW), bw = X(NOW + 0.5) - X(NOW);
    let top = b.y;
    if (band.reach === 'short') {
      let minY = 1e9; for (let k = NOW; k <= NOW + 0.5; k += 0.025) minY = Math.min(minY, Y(elevAt(Math.min(k, 6.4))));
      top = Math.max(b.y, minY - Math.max(26, gh * 0.24));
    }
    ctx.fillStyle = band.tone === 'tonal' ? '#0A3A66' : CB.b600;
    if (band.reach === 'short') { ctx.beginPath(); ctx.roundRect(bx, top, bw, b.y + gh - top + 8, [6, 6, 0, 0]); ctx.fill(); }
    else ctx.fillRect(bx, b.y, bw, gh);
    if (o.bandLabel !== false) {
      const fs = Math.max(15, Math.min(20, gh * 0.11));
      ctx.font = `${fs}px PlexCond`;
      const label = 'NEXT 500 M';
      if (ctx.measureText(label).width + 14 <= bw) text(ctx, label, 'PlexCond', fs, band.tone === 'tonal' ? '#7FB4E6' : CB.b400, bx + 7, top + fs + 5, 1e9, 1, 'left');
    }
  }
  const bars = [];
  for (let k = Math.floor(from / seg) * seg; k < Math.min(to, 6.4) - 1e-9; k += seg) bars.push([k, k + seg]);
  // Like the Karoo (ElevationAndGradeView): the profile is one smooth path through the
  // elevation; each segment is a full-height rectangle in its grade colour, cut out by that path,
  // so the tops follow the road instead of stepping. The climbed part gets navy stripes on top.
  const profilePath = () => { ctx.beginPath(); ctx.moveTo(X(from), b.y + gh);
    for (let k = from; k <= Math.min(to, 6.4) + 1e-9; k += 0.025) ctx.lineTo(X(k), Y(elevAt(Math.min(k, 6.4))));
    ctx.lineTo(X(Math.min(to, 6.4)), b.y + gh); ctx.closePath(); };
  ctx.save(); profilePath(); ctx.clip();
  for (const [k0, k1] of bars) { ctx.fillStyle = nGradeCol(grade(k0, k1)); ctx.fillRect(X(k0), b.y, X(k1) - X(k0) + 0.6, gh); }
  if (!o.noYou) {
    ctx.beginPath(); ctx.rect(b.x, b.y, X(NOW) - b.x, gh); ctx.clip();
    const hw = o.hatch ?? 3.2;
    ctx.strokeStyle = CB.b700; ctx.lineWidth = hw * 1.3;
    for (let x = b.x - gh; x < X(NOW) + gh; x += hw * 2.3) { ctx.beginPath(); ctx.moveTo(x, b.y + gh); ctx.lineTo(x + gh, b.y); ctx.stroke(); }
  }
  ctx.restore();
  // Round 14: the next 500 m on the whole climb, with more contrast
  if (MARK && !o.noYou && !o.noBand && stripH && NOW < CLIMB.lengthKm - 0.02) {   // on top: no bracket; only with the strip (round 20)
    const x0 = X(NOW), x1 = X(Math.min(NOW + 0.5, 6.4)), bot = b.y + gh;
    let minY = 1e9; for (let k = NOW; k <= NOW + 0.5; k += 0.025) minY = Math.min(minY, Y(elevAt(Math.min(k, 6.4))));
    if (MARK === 'spot' || MARK === 'spotBracket' || MARK === 'edgeBracket') {
      // the road beyond the 500 m dimmed (not in round 15's edgeBracket)
      ctx.save(); profilePath(); ctx.clip();
      if (MARK !== 'edgeBracket')
      { ctx.fillStyle = 'rgba(0, 41, 75, 0.62)'; ctx.fillRect(x1, b.y, b.x + b.w - x1, gh); }
      ctx.restore();
      // and a white edge along the road for those 500 m (rounds 14–17; removed in round 18)
      if (MARK !== 'edgeBracket') {
        ctx.beginPath(); for (let k = NOW; k <= NOW + 0.5 + 1e-9; k += 0.025) ctx.lineTo(X(k), Y(elevAt(Math.min(k, 6.4))));
        ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
      }
    }
    if (MARK === 'end') {
      // the Karoo's own way: a second, thinner white line where the 500 m ends
      ctx.fillStyle = '#FFF'; ctx.fillRect(x1 - 1, Y(elevAt(Math.min(NOW + 0.5, 6.4))) - 14, 2, bot - Y(elevAt(Math.min(NOW + 0.5, 6.4))) + 14);
      text(ctx, '500 M', 'PlexCond', 16, '#FFF', x1 + 5, Y(elevAt(Math.min(NOW + 0.5, 6.4))) - 4, 1e9, 1, 'left');
    }
    if (MARK === 'bracket' || MARK === 'spotBracket' || MARK === 'edgeBracket') {
      // round 18: the bracket as thick as the white line under you (0.44 × the ring), its left
      // end coming down to just above the ring, the right end to just above the road; label 28 px
      const rr = o.ring ?? 11, lw = rr * 0.44, py = Y(elevAt(NOW));
      const yb = Math.min(minY, py - rr) - 18, fs = MARK_PX, tick = (py - rr - 3) - yb;
      ctx.strokeStyle = '#FFF'; ctx.lineWidth = lw; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
      const yEnd = Y(elevAt(Math.min(NOW + 0.5, 6.4))) - 3;   // right end: just above the road at 500 m
      ctx.beginPath(); ctx.moveTo(x0, yb + tick); ctx.lineTo(x0, yb); ctx.lineTo(x1, yb); ctx.lineTo(x1, Math.max(yb + 6, yEnd)); ctx.stroke();
      ctx.font = `${fs}px PlexCond`;
      // under 500 m to go the bracket says what's left (rounded to 10 m)
      const left = Math.min(500, Math.round((CLIMB.lengthKm - NOW) * 100) * 10), mlabel = `${left} M`;
      const tw = ctx.measureText(mlabel).width;
      // keep the label inside the graph (near the top the bracket reaches the right edge)
      const lx = Math.min(tw < x1 - x0 + 30 ? (x0 + x1) / 2 - tw / 2 : x0 - lw / 2, b.x + b.w - 8 - tw);
      text(ctx, mlabel, 'PlexCond', fs, '#FFF', lx, yb - lw / 2 - 6, 1e9, 1, 'left');
    }
  }
  // where you are: white line down, ring on the profile
  const px = X(NOW), py = Y(elevAt(Math.max(0, NOW))), rr = o.ring ?? 11;
  if (!o.noYou) {
  ctx.fillStyle = '#FFF'; ctx.fillRect(px - rr * 0.22, py, rr * 0.44, b.y + gh - py);
  ctx.beginPath(); ctx.arc(px, py, rr, 0, Math.PI * 2); ctx.fillStyle = '#FFF'; ctx.fill();
  ctx.beginPath(); ctx.arc(px, py, rr * 0.5, 0, Math.PI * 2); ctx.fillStyle = CB.b700; ctx.fill(); }
  // round 13: the strip is the NEXT 500 M, not the columns above it: five 100 m boxes, big,
  // starting where you are and sliding left as you climb (the one you're in leaves on the left)
  if (stripH && o.strip500 && !o.noYou) {
    const sy = b.y + gh, bw5 = b.w / 5;
    ctx.save(); ctx.beginPath(); ctx.rect(b.x, sy, b.w, stripH); ctx.clip();
    // round 19: navy behind the boxes (was white), like the PR row under it
    ctx.fillStyle = CB.b700; ctx.fillRect(b.x, sy, b.w, stripH);
    for (let k0 = Math.floor(NOW * 10 + 1e-9) / 10; k0 < NOW + 0.5 - 1e-9 && k0 < CLIMB.lengthKm - 1e-9; k0 += 0.1) {
      const x0 = b.x + (k0 - NOW) / 0.5 * b.w, x1 = x0 + bw5;
      const g = grade(k0, k0 + 0.1);
      ctx.fillStyle = nGradeCol(g); ctx.fillRect(x0 + 1, sy + 2, bw5 - 2, stripH - 2);
      const vis = Math.min(x1, b.x + b.w) - Math.max(x0, b.x);
      if (vis >= bw5 * 0.6) text(ctx, g.toFixed(1), 'PlexReg', stripH * 0.8, nGradeInk(g), Math.max(x0, b.x) + vis / 2, sy + stripH * 0.82, vis - 10, 0.82, 'center');
    }
    // the easter egg: SUMMIT REACHED rides in right behind the last box, slides with them,
    // and comes to rest in the middle of the strip when you're on top
    const xEnd = b.x + (CLIMB.lengthKm - NOW) / 0.5 * b.w;
    if (xEnd < b.x + b.w) {
      const fs = stripH * 0.5, label = 'SUMMIT REACHED';
      ctx.font = `${fs}px PlexCond`;
      const iw = fs * 1.1, tw = ctx.measureText(label).width, w = iw + 8 + tw;
      const cx = Math.max(xEnd + 16 + w / 2, b.x + b.w / 2);
      const lx = cx - w / 2, base = sy + stripH * 0.68;
      icoFlag(ctx, lx, base - fs * 0.95, fs * 1.05, '#FFF');
      text(ctx, label, 'PlexCond', fs, '#FFF', lx + iw + 8, base, 1e9, 1, 'left');
    }
    ctx.restore();
  } else
  // grade strip
  if (stripH) {
    const sy = b.y + gh;
    for (const [k0, k1] of bars) {
      const g = grade(k0, k1);
      ctx.fillStyle = nGradeCol(g); ctx.fillRect(X(k0), sy, X(k1) - X(k0), stripH);
      // only whole columns get their number (no cut-off grades at the edges)
      if (k0 >= from - 1e-9 && k1 <= to + 1e-9) text(ctx, g.toFixed(1), 'PlexReg', stripH * 0.78, nGradeInk(g), (X(k0) + X(k1)) / 2, sy + stripH * 0.8, X(k1) - X(k0) - 8, 0.82, 'center');
      ctx.fillStyle = '#FFF'; ctx.fillRect(X(k1) - 1, sy, 2, stripH);
    }
  }
  if (o.label) o.label(ctx, b, X, Y);
  ctx.restore();
}
// Native-style icons in the TO TOP bar: distance (two arrows) and height (a ramp)
function icoDist(ctx, x, y, s, col) {

  ctx.beginPath(); ctx.moveTo(2, 8); ctx.lineTo(20, 8); ctx.moveTo(15, 3); ctx.lineTo(20, 8); ctx.lineTo(15, 13);

}
function icoElev(ctx, x, y, s, col) {

// Round 23: the Karoo's climb page tiles: mint icon + white label (DIST TO TOP, ELEV TO TOP)
const MINT = '#5BD69C';
function icoClock(ctx, x, y, s, col) {

// Summit flag: a peak with a little flag on top (round 19)
function icoFlag(ctx, x, y, s, col) {

// Round 24: the Karoo's own glyphs, from the ride app (ic_climber, ic_distance, ic_elevation),

// ends 9 px from the tile edge. Labels in the Karoo's label font, numbers in its number font.
function wideV(ctx, r, dark, v, o = {}) {
  const ink = dark ? '#FFF' : '#000', muted = dark ? '#A8A8A8' : '#5E5E5E';
  const R = r.x + r.w - 9;
  const gap = gapNow(o), gapC = gapCol(dark, !o.ahead);
  let G;
  if (v === 'A' || v === 'B') {
    const big = v === 'B';
    const base = r.y + (big ? 40 : 34);
    icoClimb(ctx, r.x + 12, base - 22, 24, ink);
    const nx = 44 + stravaIcon(ctx, r.x + 44, base, dark) + 8;
    const lw = text(ctx, 'ETA TO TOP', 'PlexCond', big ? 24 : 31.875, big ? muted : ink, R, big ? base - 4 : base);
    text(ctx, CLIMB.name.toUpperCase(), 'PlexCond', big ? 40 : 31.875, ink, r.x + nx, base, r.w - nx - lw - 24, 1, 'left');
    G = { x: r.x + 6, y: r.y + (big ? 56 : 50), w: 272, h: 0 };
  } else {
    G = { x: r.x + 6, y: r.y + 6, w: 272, h: 0 };
    text(ctx, o.idle ? 'NEXT CLIMB IN' : 'ETA TO TOP', 'PlexCond', 31.875, ink, R, r.y + 8 + 31.875 * 0.82);
  }
  G.h = r.y + r.h - 6 - G.y;
  ctx.save(); ctx.beginPath(); ctx.roundRect(G.x, G.y, G.w, G.h, 8); ctx.clip();
  nGraph(ctx, G, { seg: 0.2, ring: 7, hatch: 1.8, head: v.startsWith('C') ? 0.42 : 0.2, noBand: true, noYou: !!o.idle,
    label: v.startsWith('C') ? nameOnGraph(22) : null });
  ctx.restore();
  // round 12 (C2): the time under the label, VS PR under the time on the graph's bottom edge
  if (v === 'C2' && o.idle) {
    const bottom = r.y + r.h - 14;   // round 27: the Karoo's value baseline, 14 px above the bottom (KarooType.valueBaseline)
    text(ctx, `${CLIMB.lengthKm} km · ${CLIMB.avg}%`, 'PlexMed', 21, muted, R, bottom);
    const top = r.y + 8 + 31.875 * 0.82 + 10, numBase = bottom - 32;
    const kw = text(ctx, 'km', 'PlexCond', 26, ink, R, numBase);
    text(ctx, CLIMB.nextIn, 'PlexReg', Math.min(110, (numBase - top) / 0.72), ink, R - kw - 6, numBase, r.w - G.w - 60, 0.82);
    return;
  }
  if (v === 'C2') {
    const bottom = r.y + r.h - 14;   // round 27: the Karoo's value baseline, 14 px above the bottom (KarooType.valueBaseline)
    const w2 = text(ctx, 'VS\u00A0PR', 'PlexCond', 24, muted, R, bottom);   // round 26: short VS PR on this line (not TIME TO PR)
    text(ctx, gap, 'PlexMed', 26, gapC, R - w2 - 8, bottom);
    const top = r.y + 8 + 31.875 * 0.82 + 10, numBase = bottom - 32;
    text(ctx, CLIMB.toTop, 'PlexReg', Math.min(110, (numBase - top) / 0.72), ink, R, numBase, r.w - G.w - 30, 0.82);
    return;
  }
  // right column: small line on the graph's top edge (C: under the label), number on its bottom edge
  const subBase = v === 'C' ? r.y + 8 + 31.875 * 0.82 + 30 : G.y + 20;
  const w = text(ctx, 'VS PR', 'PlexCond', 24, muted, R, subBase);
  text(ctx, gap, 'PlexMed', 26, gapC, R - w - 8, subBase);
  // as big as the room between the small line and the graph's bottom edge allows (digits ≈ 0.72 of the size)
  const numSize = Math.min(110, ((G.y + G.h) - subBase - 12) / 0.72);
  text(ctx, CLIMB.toTop, 'PlexReg', numSize, ink, R, G.y + G.h - 1, r.w - G.w - 30, 0.82);
}

// kind: 'noRoute' (no route with climbs loaded) or 'done' (past the last climb of the route).
// The art: a big climb outline (no route) or the summit flag (done) on the navy graph, with a
// line of white text and a light-blue hint. No dashes, no empty numbers.
const EMPTY = {
  noRoute: { title: 'NO ROUTE', head: 'No climbs yet', hint: 'Load a route with climbs', short: 'Load a route', icon: 'climb' },
  done: { title: 'ALL CLIMBS DONE', head: 'That was the last climb', hint: '3/3 climbs done', short: '3/3 climbs done', icon: 'flag' },
};
function emptyArt(ctx, b, kind, k = 1) {
  const e = EMPTY[kind];
  ctx.fillStyle = CB.b700; ctx.fillRect(b.x, b.y, b.w, b.h);
  // a faint ridge along the bottom, so it still reads as a climb graph
  ctx.beginPath(); ctx.moveTo(b.x, b.y + b.h);
  for (let i = 0; i <= 24; i++) { const t = i / 24; ctx.lineTo(b.x + t * b.w, b.y + b.h - (0.08 + 0.22 * t + 0.03 * Math.sin(t * 13)) * b.h); }
  ctx.lineTo(b.x + b.w, b.y + b.h); ctx.closePath(); ctx.fillStyle = '#0A3A66'; ctx.fill();
  const icon = 34 * k, head = 24 * k, hint = 21 * k;   // round 20: hint 21 (was 18)
  const total = icon + 10 * k + head + 8 * k + hint, top = b.y + (b.h - total) / 2;
  (e.icon === 'flag' ? icoFlag : icoClimb)(ctx, b.x + b.w / 2 - icon / 2, top, icon, e.icon === 'flag' ? '#FFF' : CB.b400);
  text(ctx, e.head, 'PlexMed', head, '#FFF', b.x + b.w / 2, top + icon + 10 * k + head * 0.8, b.w - 20, 1, 'center');
  text(ctx, e.hint, 'PlexMed', hint, CB.b400, b.x + b.w / 2, top + icon + 10 * k + head + 8 * k + hint * 0.8, b.w - 20, 1, 'center');
}
